name: ecommerce-microservices-infra

services:

  redis-caching:
    image: redis:alpine
    container_name: redis-caching
    restart: unless-stopped
    ports:
      - 16379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  rabbitmq-broker:
    image: rabbitmq:4.2.5-management-alpine
    container_name: rabbitmq-broker
    restart: unless-stopped
    ports:
      - 15673:5672
      - 15672:15672
    volumes:
      - ./.containers/rabbitmq/data/:/var/lib/rabbitmq/
      - ./.containers/rabbitmq/log/:/var/log/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  mssql-database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-database
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Passw0rd"
      MSSQL_DATA_DIR: /var/opt/mssql/data
      MSSQL_PID: "Developer"
      MSSQL_TCP_PORT: 1433
    ports:
      - 1433:1433
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./.containers/data:/var/opt/mssql/data
      - ./.containers/log:/var/opt/mssql/log
      - ./.containers/secrets:/var/opt/mssql/secrets
    networks:
      - app-network

  # Observability. Host ports and container names differ from EcommerceApp's stack so both can run at once.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.1
    container_name: microservices-otel-collector
    restart: unless-stopped
    ports:
      - "24318:4318" # OTLP HTTP (services running on the host)
      - "19464:9464" # Prometheus metrics
      - "23133:13133" # Health check
    volumes:
      - ./otel/otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config=/etc/otel-collector.yml"]
    depends_on:
      - loki
      - tempo
    networks:
      - app-network

  loki:
    image: grafana/loki:3.6.3
    container_name: microservices-loki
    restart: unless-stopped
    ports:
      - "13100:3100"
    volumes:
      - ./loki/data:/loki/data
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
    command: -config.file=/etc/loki/config.yml
    user: "0:0"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: microservices-prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus/data
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus/data"
      - "--storage.tsdb.retention.time=7d"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  tempo:
    image: grafana/tempo:2.9.0
    container_name: microservices-tempo
    restart: unless-stopped
    ports:
      - "13200:3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - ./tempo/data:/var/tempo
    command: ["-config.file=/etc/tempo.yml"]
    networks:
      - app-network

  grafana:
    image: grafana/grafana:12.3.1
    container_name: microservices-grafana
    restart: unless-stopped
    ports:
      - "13000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/data:/var/lib/grafana/data
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    name: ecommerce-microservices-network
    driver: bridge
