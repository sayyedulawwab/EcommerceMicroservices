services:

  identity-api:
    image: ${DOCKER_REGISTRY-}identityapi
    container_name: Identity.API
    build:
      context: .
      dockerfile: src/Identity/Identity.API/Dockerfile
    ports:
      - 5006:8080
      - 5007:8081
    networks:
      - app-network

  catalog-api:
    image: ${DOCKER_REGISTRY-}catalogapi
    container_name: Catalog.API
    build:
      context: .
      dockerfile: src/Catalog/Catalog.API/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    networks:
      - app-network

  cart-api:
    image: ${DOCKER_REGISTRY-}cartapi
    container_name: Cart.API
    build:
      context: .
      dockerfile: src/Cart/Cart.API/Dockerfile
    ports:
      - 5002:8080
      - 5003:8081
    networks:
      - app-network

  ordering-api:
    image: ${DOCKER_REGISTRY-}orderingapi
    container_name: Ordering.API
    build:
      context: .
      dockerfile: src/Ordering/Ordering.API/Dockerfile
    ports:
      - 5004:8080
      - 5005:8081
    networks:
      - app-network

  payment-processor:
    image: ${DOCKER_REGISTRY-}paymentprocessor
    container_name: Payment.Processor
    build:
      context: .
      dockerfile: src/Payment/Payment.Processor/Dockerfile
    ports:
      - 5008:8080
      - 5009:8081
    networks:
      - app-network

  api-gateway:
    image: ${DOCKER_REGISTRY-}apigateway
    container_name: ApiGateway
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - 7000:8080
      - 7001:8081
    depends_on:
      - identity-api
      - catalog-api
      - cart-api
      - ordering-api
      - payment-processor
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: ecommerce-microservices-network
