# Prometheus configuration file

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    # Keep the job/instance labels the collector sets from each service's resource (service.name),
    # instead of renaming them to exported_job/exported_instance.
    honor_labels: true
    static_configs:
      - targets:
          - "otel-collector:9464"