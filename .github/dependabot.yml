version: 2
updates:
  # Upgrade PRs arrive before a vulnerable package fails the build (NuGet audit warnings are errors).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      # MassTransit 9 is commercially licensed; without MT_LICENSE every service fails at startup. Stay on 8.x.
      - dependency-name: MassTransit*
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
