name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Standard property for CI builds: deterministic paths in the build output.
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EcommerceMicroservices.slnx

      - name: Build
        run: dotnet build EcommerceMicroservices.slnx --no-restore --configuration Release

      # Testcontainers starts SQL Server, RabbitMQ and Redis in the runner's Docker for the integration tests.
      - name: Test
        run: dotnet test --solution EcommerceMicroservices.slnx --no-build --configuration Release
