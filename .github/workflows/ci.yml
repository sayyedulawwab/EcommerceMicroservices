name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Turns NuGet audit warnings (vulnerable packages) into errors. See Directory.Build.props.
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The solution also contains docker-compose.dcproj, which needs Visual Studio and doesn't
      # build on Linux, so the test projects are run directly. They build every src project.
      - name: Unit tests
        run: |
          for project in tests/*/*.UnitTests/*.csproj; do
            dotnet test --project "$project"
          done

      - name: Architecture tests
        run: dotnet test --project tests/ArchitectureTests/EcommerceMicroservices.ArchitectureTests

      # Testcontainers starts SQL Server, RabbitMQ and Redis in the runner's Docker.
      - name: Integration tests
        run: dotnet test --project tests/IntegrationTests/EcommerceMicroservices.IntegrationTests
